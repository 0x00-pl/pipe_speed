[tool.poetry]
name = "pipe_speed"
version = "0.1.0"
description = "流体网络管道流速计算器"
packages = [{include = "pipe_speed", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.visualize]
optional = true

[tool.poetry.group.visualize.dependencies]
mermaidx = ">=0.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = ">=0.8"
pytest-cov = "^7.1.0"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.poetry.scripts]
pipe-speed = "pipe_speed.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
